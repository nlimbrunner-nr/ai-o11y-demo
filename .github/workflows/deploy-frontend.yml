name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages branch

env:
  NODE_VERSION: "26"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy React App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Injected by deploy-infra.yml via `gh variable set`
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_COGNITO_USER_POOL_ID: ${{ vars.REACT_APP_COGNITO_USER_POOL_ID }}
          REACT_APP_COGNITO_CLIENT_ID: ${{ vars.REACT_APP_COGNITO_CLIENT_ID }}
          REACT_APP_COGNITO_REGION: ${{ vars.REACT_APP_COGNITO_REGION }}
          REACT_APP_COGNITO_DOMAIN: ${{ vars.REACT_APP_COGNITO_DOMAIN }}
          # Required by react-scripts to avoid treating warnings as errors
          CI: false
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/build
          branch: gh-pages
          force: true
